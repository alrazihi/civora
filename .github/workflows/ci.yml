name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CIVORA_TEST_DB_USER: civora_test
  CIVORA_TEST_DB_PASSWORD: civora_test
  CIVORA_TEST_DB_HOST: localhost
  CIVORA_TEST_DB_PORT: "5432"
  CIVORA_TEST_DB_NAME: civora_test
  CIVORA_TEST_DB_SSLMODE: disable

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (echo "Run 'gofmt -w .' and commit" && exit 1)

      - name: Run go vet
        run: GOMEMLIMIT=2GiB go vet ./internal/... ./cmd/...

      - name: golangci-lint (with gosec)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --enable=gosec --timeout=5m ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: civora_test
          POSTGRES_PASSWORD: civora_test
          POSTGRES_DB: civora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 2>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL to be ready..."
            sleep 1
          done
          pg_isready -h localhost -p 5432 || (echo "PostgreSQL did not become ready" && exit 1)

      - name: Run unit tests
        run: GOMEMLIMIT=4GiB CGO_ENABLED=1 go test -race -short -p 1 -timeout=10m ./...

      - name: Run integration tests
        run: GOMEMLIMIT=4GiB CGO_ENABLED=1 go test -race -p 1 -count=1 -timeout=20m ./internal/... ./test/e2e/... ./test/integration/...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Build
        run: CGO_ENABLED=0 go build ./...

  openapi:
    name: OpenAPI Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate OpenAPI spec
        run: npx @redocly/cli lint api/openapi/openapi.yaml
