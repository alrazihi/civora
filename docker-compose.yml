services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: civora
      POSTGRES_PASSWORD: civora
      POSTGRES_DB: civora
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civora -d civora"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    restart: unless-stopped
    command: >
      postgres -c log_statement=mod
      -c log_min_duration_statement=0
      -c max_connections=100

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      CIVORA_SERVER_PORT: 8080
      CIVORA_DB_HOST: db
      CIVORA_DB_PORT: 5432
      CIVORA_DB_USER: civora
      CIVORA_DB_PASSWORD: civora
      CIVORA_DB_NAME: civora
      CIVORA_DB_SSLMODE: disable
      CIVORA_AUTH_JWT_SECRET: "dev-secret-change-me-32-chars-minimum"
      CIVORA_AUTH_BCRYPT_COST: 4
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pg_data:
