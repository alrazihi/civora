type: object
required:
- id
- evidence_id
- status
- verified_at
- created_at
properties:
  id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  evidence_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  status:
    type: string
    enum:
    - UNVERIFIED
    - NEEDS_REVIEW
    - VERIFIED
    - REJECTED
  verifier_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    nullable: true
  verified_at:
    type: string
    format: date-time
  reason:
    type: string
    nullable: true
  method:
    type: string
    nullable: true
  notes:
    type: string
    nullable: true
  created_at:
    type: string
    format: date-time
