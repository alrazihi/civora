type: object
description: The result of evaluating a rule set against facts.
required:
- id
- rule_set_id
- rule_set_version
- organization_id
- status
- outcome
- trigger
- evaluated_at
properties:
  id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  rule_set_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  rule_set_version:
    type: integer
  organization_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  case_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    nullable: true
  status:
    type: string
    enum:
    - ELIGIBLE
    - INELIGIBLE
    - REQUIRES_REVIEW
    - INFORMATION_REQUIRED
    - FLAG
    - SCORE
    - ERROR
  outcome:
    type: string
    enum:
    - ELIGIBLE
    - INELIGIBLE
    - REQUIRES_REVIEW
    - INFORMATION_REQUIRED
    - FLAG
    - SCORE
    - ERROR
  reason:
    type: string
    nullable: true
    description: Human-readable explanation of the outcome.
  matched_rule_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    nullable: true
  trace:
    type: array
    items:
      $ref: '#/components/schemas/TraceNode'
    description: Evaluation trace tree for debugging/explanation.
  trigger:
    type: string
    enum:
    - MANUAL
    - AUTOMATIC
  evaluated_by:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    nullable: true
  evaluated_at:
    type: string
    format: date-time
  facts_snapshot:
    type: object
    description: The facts as they were at evaluation time.
    additionalProperties: true
