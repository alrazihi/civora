type: object
required:
- id
- organization_id
- service_request_id
- type
- description
- status
- responsible_staff
- created_at
- updated_at
properties:
  id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  organization_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  service_request_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  type:
    type: string
    enum:
    - FINANCIAL
    - FOOD
    - SHELTER
    - MEDICAL
    - EDUCATION
    - TRANSPORT
    - OTHER
  description:
    type: string
  status:
    type: string
    enum:
    - PLANNED
    - IN_PROGRESS
    - COMPLETED
    - CANCELLED
  responsible_staff:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  started_at:
    type: string
    format: date-time
    nullable: true
  completed_at:
    type: string
    format: date-time
    nullable: true
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
