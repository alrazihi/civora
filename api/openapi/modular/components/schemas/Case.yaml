type: object
required:
- id
- organization_id
- case_number
- title
- status
- service_type
- priority
- created_by
- created_at
- updated_at
properties:
  id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  organization_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  case_number:
    type: string
    example: CAS-20260906-00001234
  person_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    nullable: true
  title:
    type: string
  description:
    type: string
    nullable: true
  status:
    type: string
    description: Case status synchronized from the configured workflow
  service_type:
    type: string
    enum:
    - GENERAL
    - EMERGENCY
    - FINANCIAL
    - FOOD
    - SHELTER
    - MEDICAL
    - EDUCATION
    - TRANSPORT
  priority:
    type: string
    enum:
    - LOW
    - NORMAL
    - HIGH
    - URGENT
  created_by:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  assigned_to:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    nullable: true
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  closed_at:
    type: string
    format: date-time
    nullable: true
  workflow_instance_id:
    type: string
    format: uuid
    nullable: true
    description: Linked workflow instance ID for generic workflow-driven state transitions
  workflow_state:
    type: string
    nullable: true
    description: Authoritative lifecycle state from the linked workflow instance.
      Mirrors status but is the single source of truth for lifecycle transitions.
