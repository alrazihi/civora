type: object
required:
- id
- tenant_id
- workflow_definition_id
- workflow_state_key
- form_id
- form_version_id
- required
- display_order
- active
- created_by
- created_at
- updated_at
properties:
  id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  tenant_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  workflow_definition_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  workflow_state_key:
    type: string
  form_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  form_version_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  required:
    type: boolean
  display_order:
    type: integer
  active:
    type: boolean
  created_by:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
