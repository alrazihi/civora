type: object
required:
- id
- organization_id
- service_request_id
- type
- description
- uploaded_by
- created_at
properties:
  id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  organization_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  service_request_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  type:
    type: string
    enum:
    - IDENTITY_DOCUMENT
    - PROOF_OF_RESIDENCE
    - REFERRAL
    - SUPPORTING_DOCUMENT
    - PHOTOGRAPH
    - STAFF_NOTE
    - OTHER
  custom_type:
    type: string
    description: Custom evidence type name, required when type is OTHER.
    nullable: true
  description:
    type: string
  uploaded_by:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  person_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    nullable: true
    description: Person associated with this evidence.
  source:
    type: string
    enum:
    - UPLOAD
    - EXTERNAL_REFERENCE
    - EXTERNAL_API
    - MANUAL
    description: How the evidence entered the system.
  metadata:
    type: object
    description: Arbitrary structured metadata (file size, content type, checksum,
      etc.).
    additionalProperties: true
  verification_status:
    type: string
    enum:
    - UNVERIFIED
    - NEEDS_REVIEW
    - VERIFIED
    - REJECTED
    description: Current verification status of the evidence.
  verified_by:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    nullable: true
    description: User who last changed the verification status.
  verified_at:
    type: string
    format: date-time
    nullable: true
    description: Timestamp of the last verification state change.
  verification_reason:
    type: string
    nullable: true
    description: Reason for the current verification status.
  verification_method:
    type: string
    nullable: true
    description: Method used for verification (e.g. manual, automated).
  created_at:
    type: string
    format: date-time
