type: object
required:
- id
- organization_id
- first_name
- last_name
- preferred_language
- status
- created_at
- updated_at
properties:
  id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  organization_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  external_reference:
    type: string
    nullable: true
  first_name:
    type: string
  last_name:
    type: string
  date_of_birth:
    type: string
    format: date
    nullable: true
  email:
    type: string
    format: email
    nullable: true
  phone:
    type: string
    nullable: true
  address:
    type: string
    nullable: true
  city:
    type: string
    nullable: true
  preferred_language:
    type: string
  status:
    type: string
    enum:
    - ACTIVE
    - INACTIVE
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
