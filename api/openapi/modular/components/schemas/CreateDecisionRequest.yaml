type: object
required:
- service_request_id
- decision
- reason
properties:
  service_request_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  decision:
    type: string
    enum:
    - APPROVED
    - REJECTED
    - NEEDS_MORE_INFORMATION
    - ESCALATE
  reason:
    type: string
