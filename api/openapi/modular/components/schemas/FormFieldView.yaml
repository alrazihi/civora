type: object
description: A discoverable form field for fact-path suggestions.
required:
- key
- label
- type
- required
properties:
  key:
    type: string
    description: Stable identifier in the form `{formKey}.{fieldKey}`.
  label:
    type: string
    description: 'Display label: `{FormName}: {FieldLabel}`.'
  type:
    type: string
    enum:
    - TEXT
    - TEXTAREA
    - NUMBER
    - DECIMAL
    - DATE
    - DATETIME
    - BOOLEAN
    - SELECT
    - MULTISELECT
    - RADIO
    - CHECKBOX
    - EMAIL
    - PHONE
  required:
    type: boolean
  options:
    type: array
    items:
      $ref: '#/components/schemas/FormOptionView'
