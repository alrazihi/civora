type: object
required:
- id
- organization_id
- service_request_id
- decision
- reason
- decision_maker
- decided_at
- created_at
properties:
  id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  organization_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  service_request_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  decision:
    type: string
    enum:
    - APPROVED
    - REJECTED
    - NEEDS_MORE_INFORMATION
    - ESCALATE
  reason:
    type: string
  decision_maker:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  decided_at:
    type: string
    format: date-time
  created_at:
    type: string
    format: date-time
  workflow_state:
    type: string
  rule_evaluation_ids:
    type: array
    items:
      type: string
      format: uuid
    nullable: true
  evidence_ids:
    type: array
    items:
      type: string
      format: uuid
    nullable: true
  form_submission_id:
    type: string
    format: uuid
    nullable: true
  review_queue_entry_id:
    type: string
    format: uuid
    nullable: true
  superseded_by_id:
    type: string
    format: uuid
    nullable: true
  version:
    type: integer
