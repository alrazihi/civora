type: object
description: A node in the evaluation trace tree.
properties:
  id:
    type: string
  node_type:
    type: string
    enum:
    - leaf
    - group
    - rule
    - root
  description:
    type: string
  field:
    type: string
  operator:
    type: string
  expected:
    description: Expected value as JSON.
  actual:
    description: Actual value as JSON.
  actual_type:
    type: string
  result:
    type: string
    enum:
    - 'TRUE'
    - 'FALSE'
    - UNKNOWN
    - ERROR
  reason:
    type: string
  children:
    type: array
    items:
      $ref: '#/components/schemas/TraceNode'
  timestamp:
    type: string
    format: date-time
