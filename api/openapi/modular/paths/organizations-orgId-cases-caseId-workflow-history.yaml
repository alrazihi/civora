get:
  operationId: getCaseWorkflowHistory
  tags:
  - Workflows
  summary: Get workflow transition history
  description: Retrieves the transition history for a case workflow instance. Requires
    authentication.
  security:
  - BearerAuth: []
  parameters:
  - name: orgId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: caseId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: List of workflow transition history events
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/WorkflowTransitionHistory'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '404':
      $ref: '#/components/responses/NotFound'
