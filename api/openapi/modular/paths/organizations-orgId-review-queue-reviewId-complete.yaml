post:
  operationId: completeReview
  tags:
  - ReviewQueue
  summary: Complete a review
  description: Marks the review as completed with a human decision.
  security:
  - BearerAuth: []
  parameters:
  - name: orgId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: reviewId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/CompleteReviewRequest'
  responses:
    '200':
      description: Review completed
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                $ref: '#/components/schemas/ReviewQueueEntry'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      description: Review is not in review
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
