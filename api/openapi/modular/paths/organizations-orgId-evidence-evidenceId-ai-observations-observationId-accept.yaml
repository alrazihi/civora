post:
  operationId: acceptObservation
  tags:
  - AI
  summary: Accept an AI observation
  description: Marks an AI-observed PENDING_REVIEW observation as ACCEPTED. Accepting
    an observation does not affect case decisions or workflow until a human reviewer
    uses it. Requires authentication.
  security:
  - BearerAuth: []
  parameters:
  - name: orgId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  - name: evidenceId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  - name: observationId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ReviewObservationRequest'
  responses:
    '200':
      description: Observation accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AIObservation'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '404':
      $ref: '#/components/responses/NotFound'
