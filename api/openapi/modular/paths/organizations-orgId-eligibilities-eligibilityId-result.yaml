patch:
  operationId: updateEligibilityResult
  tags:
  - Eligibilities
  summary: Update eligibility result
  description: Updates the result of an eligibility assessment. Requires admin or
    staff role.
  security:
  - BearerAuth: []
  parameters:
  - name: orgId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  - name: eligibilityId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/UpdateEligibilityResultRequest'
  responses:
    '200':
      description: Updated eligibility
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Eligibility'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      description: Forbidden - admin or staff role required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      $ref: '#/components/responses/NotFound'
