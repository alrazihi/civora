patch:
  operationId: completeFollowUp
  tags:
  - FollowUps
  summary: Complete a follow-up
  description: Marks a follow-up as completed. Requires admin or staff role.
  security:
  - BearerAuth: []
  parameters:
  - name: orgId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  - name: followUpId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/CompleteFollowUpRequest'
  responses:
    '200':
      description: Completed follow-up
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FollowUp'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      description: Forbidden - admin or staff role required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      $ref: '#/components/responses/NotFound'
