post:
  operationId: createOrgdecisions
  tags:
  - Decisions
  summary: Make a decision
  description: Creates a human decision for a service request. Requires authentication.
  security:
  - BearerAuth: []
  parameters:
  - name: orgId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/CreateDecisionRequest'
  responses:
    '201':
      description: Decision created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Decision'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
