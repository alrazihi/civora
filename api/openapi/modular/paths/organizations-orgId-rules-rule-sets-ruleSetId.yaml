get:
  operationId: getRuleSet
  tags:
  - Rules
  summary: Get a rule set
  description: Gets a rule set by ID.
  security:
  - BearerAuth: []
  parameters:
  - name: orgId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  - name: ruleSetId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  responses:
    '200':
      description: Rule set details
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                $ref: '#/components/schemas/RuleSet'
              pagination:
                type: object
                nullable: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
patch:
  operationId: updateRuleSet
  tags:
  - Rules
  summary: Update a rule set
  description: Updates a draft rule set. Requires admin role.
  security:
  - BearerAuth: []
  parameters:
  - name: orgId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  - name: ruleSetId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/UpdateRuleSetRequest'
  responses:
    '200':
      description: Rule set updated
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                $ref: '#/components/schemas/RuleSet'
              pagination:
                type: object
                nullable: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      $ref: '#/components/responses/Conflict'
delete:
  operationId: deleteRuleSet
  tags:
  - Rules
  summary: Delete a rule set
  description: Deletes a draft rule set. Published rule sets must be archived first.
    Requires admin role.
  security:
  - BearerAuth: []
  parameters:
  - name: orgId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  - name: ruleSetId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  responses:
    '200':
      description: Rule set deleted
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  deleted:
                    type: boolean
                    example: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      $ref: '#/components/responses/Conflict'
