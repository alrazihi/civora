get:
  operationId: getWorkflowRequirements
  tags:
  - Cases
  summary: Get workflow requirements for a case
  description: Retrieves the workflow requirements including missing forms. Requires
    authentication.
  security:
  - BearerAuth: []
  parameters:
  - name: orgId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  - name: caseId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  responses:
    '200':
      description: Workflow requirements
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkflowRequirements'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '404':
      $ref: '#/components/responses/NotFound'
