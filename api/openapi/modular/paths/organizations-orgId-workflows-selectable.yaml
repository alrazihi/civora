get:
  operationId: listSelectableWorkflows
  tags:
  - Workflows
  summary: List active workflow definitions for case creation
  description: Lists ACTIVE workflow definitions that can be used for case creation.
    Requires authentication.
  security:
  - BearerAuth: []
  parameters:
  - name: orgId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: page
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: per_page
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 200
      default: 20
  responses:
    '200':
      description: Paginated list of active workflow definitions usable for case creation
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowDefinition'
              meta:
                type: object
    '401':
      $ref: '#/components/responses/Unauthorized'
