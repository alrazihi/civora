get:
  operationId: listRuleTemplates
  tags:
  - Rules
  summary: List rule templates
  description: Lists rule templates for an organization with optional filtering by
    scope and category.
  security:
  - BearerAuth: []
  parameters:
  - name: orgId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  - name: scope
    in: query
    required: false
    schema:
      type: string
      enum:
      - ORG
      - GLOBAL
  - name: category
    in: query
    required: false
    schema:
      type: string
  - name: page
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: per_page
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 200
      default: 20
  responses:
    '200':
      description: Paginated list of rule templates
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: array
                items:
                  $ref: '#/components/schemas/RuleTemplate'
              pagination:
                type: object
                properties:
                  page:
                    type: integer
                  per_page:
                    type: integer
                  total:
                    type: integer
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  operationId: createRuleTemplate
  tags:
  - Rules
  summary: Create a rule template
  description: Creates a new rule template. Requires admin role.
  security:
  - BearerAuth: []
  parameters:
  - name: orgId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/CreateRuleTemplateRequest'
  responses:
    '201':
      description: Rule template created
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                $ref: '#/components/schemas/RuleTemplate'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '409':
      description: Rule template key already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
