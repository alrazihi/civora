post:
  operationId: createOrgfollowups
  tags:
  - FollowUps
  summary: Create a follow-up
  description: Creates a new follow-up item for a service request. Requires authentication.
  security:
  - BearerAuth: []
  parameters:
  - name: orgId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/CreateFollowUpRequest'
  responses:
    '201':
      description: Follow-up created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FollowUp'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
