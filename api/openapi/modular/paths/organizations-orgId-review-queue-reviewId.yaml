get:
  operationId: getReviewQueueEntry
  tags:
  - ReviewQueue
  summary: Get review queue entry
  description: Returns a single review queue entry by ID.
  security:
  - BearerAuth: []
  parameters:
  - name: orgId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: reviewId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: Review queue entry
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                $ref: '#/components/schemas/ReviewQueueEntry'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
