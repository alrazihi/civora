post:
  operationId: createOrgauthregister
  tags:
  - Authentication
  summary: Register a new user
  description: Creates a new user within the specified organization. No prior authentication
    required.
  parameters:
  - name: orgId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/RegisterRequest'
  responses:
    '201':
      description: User registered (returns user data, not token)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
    '400':
      $ref: '#/components/responses/BadRequest'
    '409':
      description: Email already registered in this organization
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
