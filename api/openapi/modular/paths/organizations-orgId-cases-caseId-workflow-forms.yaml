get:
  operationId: getCaseWorkflowForms
  tags:
  - Cases
  summary: Get forms required for case workflow state
  description: Retrieves forms assigned to the case's current workflow state. Requires
    authentication.
  security:
  - BearerAuth: []
  parameters:
  - name: orgId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  - name: caseId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  - name: state
    in: query
    required: false
    schema:
      type: string
    description: Workflow state key to filter forms by
  responses:
    '200':
      description: List of available forms for the case workflow state
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CaseFormAvailability'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
