post:
  operationId: createOrgevidence
  tags:
  - Evidence
  summary: Add evidence
  description: Adds an evidence item for a service request. Requires authentication.
  security:
  - BearerAuth: []
  parameters:
  - name: orgId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/CreateEvidenceRequest'
  responses:
    '201':
      description: Evidence created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Evidence'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
