post:
  operationId: submitFormByKey
  tags:
  - Cases
  summary: Submit a form by key
  description: Submits form data for a case by form key. Requires authentication.
  security:
  - BearerAuth: []
  parameters:
  - name: orgId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  - name: caseId
    in: path
    required: true
    schema:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/SubmitFormRequest'
  responses:
    '201':
      description: Form submitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FormSubmission'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      description: Form already submitted or not assigned
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
