type: object
required:
  - id
  - action
  - resource
  - outcome
  - timestamp
properties:
  id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  action:
    type: string
  resource:
    type: string
  outcome:
    type: string
    enum:
      - success
      - failure
  timestamp:
    type: string
    format: date-time
  metadata:
    type: object
    additionalProperties: true
