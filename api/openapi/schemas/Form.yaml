type: object
required:
  - id
  - organization_id
  - key
  - name
  - status
  - created_at
  - updated_at
properties:
  id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  organization_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  key:
    type: string
  name:
    type: string
  description:
    type: string
    nullable: true
  status:
    type: string
    enum:
      - DRAFT
      - ACTIVE
      - ARCHIVED
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
    nullable: true
