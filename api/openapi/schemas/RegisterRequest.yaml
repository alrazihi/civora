type: object
required:
  - email
  - name
  - password
properties:
  email:
    type: string
    format: email
  name:
    type: string
    maxLength: 200
  password:
    type: string
    minLength: 12
    pattern: ^(?=.*[a-zA-Z])(?=.*[0-9]).+$
    description: At least 12 characters with at least one letter and one number
