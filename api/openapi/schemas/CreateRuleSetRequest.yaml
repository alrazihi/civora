type: object
required:
  - key
  - name
properties:
  case_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  key:
    type: string
    pattern: ^[a-z][a-z0-9_-]*$
  name:
    type: string
  description:
    type: string
  default_outcome:
    type: string
    enum:
      - ELIGIBLE
      - INELIGIBLE
      - REQUIRES_REVIEW
      - INFORMATION_REQUIRED
      - FLAG
      - SCORE
      - ERROR
  rules:
    type: array
    items:
      $ref: '#/components/schemas/Rule'
  triggers:
    type: array
    items:
      type: string
