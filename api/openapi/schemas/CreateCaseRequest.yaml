type: object
required:
  - title
  - service_type
  - priority
properties:
  title:
    type: string
    maxLength: 300
  description:
    type: string
    maxLength: 5000
  service_type:
    type: string
    enum:
      - GENERAL
      - EMERGENCY
      - FINANCIAL
      - FOOD
      - SHELTER
      - MEDICAL
      - EDUCATION
      - TRANSPORT
  priority:
    type: string
    enum:
      - LOW
      - NORMAL
      - HIGH
      - URGENT
  person_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  workflow_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    nullable: true
    description: |-
      Optional workflow definition ID. Must be an ACTIVE workflow belonging
      to the organization. If omitted, the workflow is resolved from the
      service_type via a configurable, database-driven mapping
      (workflow_definitions.metadata.service_type). If none is found,
      workflow_id is required.
