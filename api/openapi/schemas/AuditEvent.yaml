type: object
properties:
  id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  organization_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  actor_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    nullable: true
  action:
    type: string
  resource:
    type: string
  resource_id:
    type: string
    nullable: true
  outcome:
    type: string
    enum:
      - success
      - failure
  request_id:
    type: string
    nullable: true
  timestamp:
    type: string
    format: date-time
  hash:
    type: string
  previous_hash:
    type: string
    nullable: true
