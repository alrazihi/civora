type: object
required:
  - scope
  - key
  - name
  - rule
properties:
  scope:
    $ref: '#/components/schemas/RuleTemplateScope'
  key:
    type: string
    pattern: ^[a-z][a-z0-9_-]*$
    maxLength: 100
  name:
    type: string
    maxLength: 200
  description:
    type: string
    maxLength: 2000
    nullable: true
  category:
    type: string
    maxLength: 100
    nullable: true
  rule:
    $ref: '#/components/schemas/Rule'
