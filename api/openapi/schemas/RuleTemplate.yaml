type: object
description: A reusable rule template that can be instantiated into rule sets.
required:
  - id
  - scope
  - key
  - name
  - rule
properties:
  id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  scope:
    $ref: '#/components/schemas/RuleTemplateScope'
  organization_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    nullable: true
    description: Organization ID (null for GLOBAL scope).
  key:
    type: string
    pattern: ^[a-z][a-z0-9_-]*$
    maxLength: 100
    description: Unique machine-readable identifier within the scope.
  name:
    type: string
    maxLength: 200
    description: Human-readable name.
  description:
    type: string
    maxLength: 2000
    nullable: true
    description: Human-readable description.
  category:
    type: string
    maxLength: 100
    nullable: true
    description: Category for grouping templates (e.g., 'eligibility', 'age', 'income').
  rule:
    $ref: '#/components/schemas/Rule'
  created_by:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
