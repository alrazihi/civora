type: object
required:
  - service_request_id
  - findings
  - recommendation
properties:
  service_request_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  findings:
    type: string
  needs_identified:
    type: string
    nullable: true
  recommendation:
    type: string
