type: object
properties:
  id:
    type: string
    format: uuid
  organization_id:
    type: string
    format: uuid
  evidence_id:
    type: string
    format: uuid
  type:
    type: string
    enum:
      - SUMMARY
      - ENTITY_EXTRACTION
      - CLASSIFICATION
      - INCONSISTENCY
  source:
    type: string
    enum:
      - AI_MODEL
      - HUMAN
  status:
    type: string
    enum:
      - PENDING_REVIEW
      - ACCEPTED
      - REJECTED
  model:
    $ref: '#/components/schemas/AIModelInfo'
  content:
    type: object
  confidence:
    type: number
    format: float
    minimum: 0
    maximum: 1
    nullable: true
  input_hash:
    type: string
  output_hash:
    type: string
  created_at:
    type: string
    format: date-time
  reviewed_at:
    type: string
    format: date-time
    nullable: true
  review_notes:
    type: string
    nullable: true
