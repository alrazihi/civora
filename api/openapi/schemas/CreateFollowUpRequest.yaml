type: object
required:
  - service_request_id
  - scheduled_date
  - outcome
  - notes
properties:
  service_request_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  scheduled_date:
    type: string
    format: date
    description: ISO 8601 date (YYYY-MM-DD)
  outcome:
    type: string
  notes:
    type: string
