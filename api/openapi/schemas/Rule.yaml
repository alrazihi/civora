type: object
description: A single conditional rule with an outcome and priority.
required:
  - outcome
  - conditions
properties:
  id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  priority:
    type: integer
    minimum: 0
  outcome:
    type: string
    enum:
      - ELIGIBLE
      - INELIGIBLE
      - REQUIRES_REVIEW
      - INFORMATION_REQUIRED
      - FLAG
      - SCORE
      - ERROR
  conditions:
    $ref: '#/components/schemas/Condition'
  active:
    type: boolean
    description: Whether this rule is enabled.
  created_at:
    type: string
    format: date-time
