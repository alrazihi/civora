type: object
required:
  - service_request_id
  - type
  - description
  - responsible_staff
properties:
  service_request_id:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  type:
    type: string
    enum:
      - FINANCIAL
      - FOOD
      - SHELTER
      - MEDICAL
      - EDUCATION
      - TRANSPORT
      - OTHER
  description:
    type: string
  responsible_staff:
    type: string
    format: uuid
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
