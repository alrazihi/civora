post:
  operationId: createOrgeligibilities
  tags:
    - Eligibilities
  summary: Create an eligibility assessment
  description: Creates a new eligibility assessment for a service request. Requires authentication.
  security:
    - BearerAuth: []
  parameters:
    - name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/CreateEligibilityRequest'
  responses:
    '201':
      description: Eligibility created (result defaults to REQUIRES_MORE_INFORMATION)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Eligibility'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
get:
  operationId: getOrgeligibilities
  tags:
    - Eligibilities
  summary: List eligibilities
  description: Lists eligibility assessments in the organization. Requires authentication.
  security:
    - BearerAuth: []
  parameters:
    - name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    - name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
  responses:
    '200':
      description: List of eligibilities with pagination
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Eligibility'
    '401':
      $ref: '#/components/responses/Unauthorized'
