get:
  operationId: getCaseWorkflowTransitions
  tags:
    - Workflows
  summary: List valid workflow transitions
  description: Lists valid transitions from the current workflow state. Requires authentication.
  security:
    - BearerAuth: []
  parameters:
    - name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: List of valid transitions
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/WorkflowTransition'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '404':
      $ref: '#/components/responses/NotFound'
