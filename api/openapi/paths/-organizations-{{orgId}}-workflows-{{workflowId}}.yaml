get:
  operationId: getOrgWorkflow
  tags:
    - Workflows
  summary: Get workflow definition
  description: Retrieves a workflow definition with states and transitions. Requires authentication.
  security:
    - BearerAuth: []
  parameters:
    - name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: workflowId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Workflow definition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkflowDefinition'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '404':
      $ref: '#/components/responses/NotFound'
put:
  operationId: updateOrgWorkflow
  tags:
    - Workflows
  summary: Update workflow definition
  description: Updates a draft workflow definition. Requires authentication.
  security:
    - BearerAuth: []
  parameters:
    - name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: workflowId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/CreateWorkflowDefinitionRequest'
  responses:
    '200':
      description: Workflow definition updated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkflowDefinition'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      description: Cannot update non-draft workflow definition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
delete:
  operationId: deleteOrgWorkflow
  tags:
    - Workflows
  summary: Delete workflow definition
  description: Deletes a draft workflow definition. Requires authentication.
  security:
    - BearerAuth: []
  parameters:
    - name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: workflowId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Workflow definition deleted
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: deleted
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      description: Cannot delete non-draft workflow definition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
