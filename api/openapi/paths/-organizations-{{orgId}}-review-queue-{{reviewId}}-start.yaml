post:
  operationId: startReview
  tags:
    - ReviewQueue
  summary: Start reviewing
  description: Marks the review queue entry as in review for the assigned user.
  security:
    - BearerAuth: []
  parameters:
    - name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: reviewId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Review started
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                $ref: '#/components/schemas/ReviewQueueEntry'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
