post:
  operationId: createOrgassistance
  tags:
    - Assistance
  summary: Create an assistance action
  description: Creates a new assistance action for a service request. Requires authentication.
  security:
    - BearerAuth: []
  parameters:
    - name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/CreateAssistanceRequest'
  responses:
    '201':
      description: Assistance created (status defaults to PLANNED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Assistance'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
