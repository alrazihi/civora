get:
  operationId: getEvidenceById
  tags:
    - Evidence
  summary: Get evidence
  description: Retrieves a specific evidence item. Requires authentication.
  security:
    - BearerAuth: []
  parameters:
    - name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    - name: evidenceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  responses:
    '200':
      description: Evidence details
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Evidence'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '404':
      $ref: '#/components/responses/NotFound'
patch:
  operationId: updateEvidenceMetadata
  tags:
    - Evidence
  summary: Update evidence metadata
  description: Updates metadata on an existing evidence item. Requires authentication.
  security:
    - BearerAuth: []
  parameters:
    - name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    - name: evidenceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - metadata
          properties:
            metadata:
              type: object
              description: Arbitrary structured metadata (file size, content type, checksum, etc.).
              additionalProperties: true
  responses:
    '200':
      description: Evidence metadata updated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Evidence'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '404':
      $ref: '#/components/responses/NotFound'
