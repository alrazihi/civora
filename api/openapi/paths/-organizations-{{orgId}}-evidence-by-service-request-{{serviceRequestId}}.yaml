get:
  operationId: listEvidenceByServiceRequestId
  tags:
    - Evidence
  summary: List evidence by service request
  description: Lists evidence items for a specific service request. Requires authentication.
  security:
    - BearerAuth: []
  parameters:
    - name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    - name: serviceRequestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    - name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
  responses:
    '200':
      description: List of evidence items with pagination
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Evidence'
    '401':
      $ref: '#/components/responses/Unauthorized'
