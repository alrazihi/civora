get:
  operationId: getCaseFormSubmissions
  tags:
    - Cases
  summary: List form submissions for case workflow
  description: Lists all form submissions for a case. Requires authentication.
  security:
    - BearerAuth: []
  parameters:
    - name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    - name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    - name: state
      in: query
      required: false
      schema:
        type: string
      description: Workflow state key to filter submissions by
  responses:
    '200':
      description: Form submissions keyed by form key
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/FormSubmission'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
