post:
  operationId: createOrgpeople
  tags:
    - People
  summary: Create a person
  description: Creates a new person record. Requires authentication.
  security:
    - BearerAuth: []
  parameters:
    - name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/CreatePersonRequest'
  responses:
    '201':
      description: Person created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Person'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
get:
  operationId: getOrgpeople
  tags:
    - People
  summary: List people
  description: Lists person records in the organization. Requires authentication.
  security:
    - BearerAuth: []
  parameters:
    - name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    - name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
  responses:
    '200':
      description: List of people with pagination
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Person'
    '401':
      $ref: '#/components/responses/Unauthorized'
