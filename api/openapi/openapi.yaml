openapi: 3.0.3

info:
  title: CIVORA API
  description: |
    CIVORA API - open digital infrastructure for public-interest service delivery.

    Version: 0.2.0-service-delivery

    ## Public-Interest Service Delivery Lifecycle

    Full end-to-end workflow for public service delivery:
    Request → Person registered → Case created (NEW) → OPEN →
    Eligibility assessed → Evidence collected → IN_REVIEW →
    Assessment completed → DECISION_PENDING → Decision made →
    APPROVED/REJECTED → IN_PROGRESS → Assistance provided →
    FOLLOW_UP → CLOSED

    State machine:
    NEW → OPEN → IN_REVIEW → ASSESSMENT → DECISION_PENDING →
    APPROVED → IN_PROGRESS → FOLLOW_UP → CLOSED
    REJECTED → CLOSED
  version: "0.2.0"
  contact:
    name: CIVORA
    url: https://github.com/alrazihi/civora
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080
    description: Local development server. Override with CIVORA_API_URL in production.

security: []

tags:
  - name: Organizations
    description: Organization (tenant) management
  - name: Authentication
    description: User registration and authentication
  - name: Users
    description: User management within an organization
  - name: People
    description: Person (client/individual) records
  - name: Cases
    description: Case lifecycle management with state transitions
  - name: Eligibilities
    description: Eligibility assessment for service requests
  - name: Evidence
    description: Evidence items submitted for service requests
  - name: Assessments
    description: Needs assessment and recommendations
  - name: Decisions
    description: Human decisions on service requests
  - name: Assistance
    description: Assistance actions and services provided
  - name: FollowUps
    description: Follow-up scheduling and completion
  - name: Audit
    description: Immutable audit event log
  - name: Workflows
    description: Configurable workflow definitions, instances, and transitions
  - name: System
    description: Health and readiness checks

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT bearer token. The token must include `organization_id` claim.
        The API validates that the token's organization matches the `{orgId}`
        path parameter on all tenant-scoped endpoints.

  headers:
    X-Request-ID:
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      description: Correlation ID for the request. Generated if not provided by the client.

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: INVALID_INPUT
            message:
              type: string
              example: "title is required"

    Organization:
      type: object
      required: [id, name, slug, created_at]
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        name:
          type: string
        description:
          type: string
          nullable: true
        slug:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true

    CreateOrganizationRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        slug:
          type: string
          pattern: "^[a-z0-9-]+$"
          maxLength: 64

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RegisterRequest:
      type: object
      required: [email, name, password]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          maxLength: 200
        password:
          type: string
          minLength: 12
          pattern: "^(?=.*[a-zA-Z])(?=.*[0-9]).+$"
          description: "At least 12 characters with at least one letter and one number"

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT bearer token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
              pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            organization_id:
              type: string
              format: uuid
              pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            email:
              type: string
              format: email
            name:
              type: string

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        organization_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        email:
          type: string
          format: email
        name:
          type: string
        role_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          nullable: true
        created_at:
          type: string
          format: date-time

    Case:
      type: object
      required: [id, organization_id, case_number, title, status, service_type, priority, created_by, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        organization_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        case_number:
          type: string
          example: "CAS-20260906-00001234"
        person_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [NEW, OPEN, IN_REVIEW, ASSESSMENT, DECISION_PENDING, APPROVED, REJECTED, IN_PROGRESS, FOLLOW_UP, CLOSED]
        service_type:
          type: string
          enum: [GENERAL, EMERGENCY, FINANCIAL, FOOD, SHELTER, MEDICAL, EDUCATION, TRANSPORT]
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH, URGENT]
        created_by:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        assigned_to:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
        workflow_instance_id:
          type: string
          format: uuid
          nullable: true
          description: Linked workflow instance ID for generic workflow-driven state transitions
        workflow_state:
          type: string
          nullable: true
          description: Authoritative lifecycle state from the linked workflow instance. Mirrors status but is the single source of truth for lifecycle transitions.
          enum: [NEW, OPEN, IN_REVIEW, ASSESSMENT, DECISION_PENDING, APPROVED, REJECTED, IN_PROGRESS, FOLLOW_UP, CLOSED]

    CreateCaseRequest:
      type: object
      required: [title, service_type, priority]
      properties:
        title:
          type: string
          maxLength: 300
        description:
          type: string
          maxLength: 5000
        service_type:
          type: string
          enum: [GENERAL, EMERGENCY, FINANCIAL, FOOD, SHELTER, MEDICAL, EDUCATION, TRANSPORT]
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH, URGENT]
        person_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$

    ChangeCaseStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [NEW, OPEN, IN_REVIEW, ASSESSMENT, DECISION_PENDING, APPROVED, REJECTED, IN_PROGRESS, FOLLOW_UP, CLOSED]

    AssignCaseRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$

    TimelineEvent:
      type: object
      required: [id, action, resource, outcome, timestamp]
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        action:
          type: string
        resource:
          type: string
        outcome:
          type: string
          enum: [success, failure]
        timestamp:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true

    Person:
      type: object
      required: [id, organization_id, first_name, last_name, preferred_language, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        organization_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        external_reference:
          type: string
          nullable: true
        first_name:
          type: string
        last_name:
          type: string
        date_of_birth:
          type: string
          format: date
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        preferred_language:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreatePersonRequest:
      type: object
      required: [first_name, last_name, preferred_language]
      properties:
        external_reference:
          type: string
          nullable: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        date_of_birth:
          type: string
          format: date
          description: "ISO 8601 date (YYYY-MM-DD), nullable"
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          maxLength: 500
          nullable: true
        city:
          type: string
          maxLength: 100
          nullable: true
        preferred_language:
          type: string
          maxLength: 10

    UpdatePersonStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    Eligibility:
      type: object
      required: [id, organization_id, service_request_id, criteria, result, explanation, assessed_by, assessed_at, created_at]
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        organization_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        service_request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        criteria:
          type: object
          additionalProperties: true
          description: JSONB object containing eligibility criteria
        result:
          type: string
          enum: [ELIGIBLE, NOT_ELIGIBLE, REQUIRES_MORE_INFORMATION]
        explanation:
          type: string
        assessed_by:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        assessed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    CreateEligibilityRequest:
      type: object
      required: [service_request_id, criteria, explanation]
      properties:
        service_request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        criteria:
          type: object
          additionalProperties: true
        explanation:
          type: string

    UpdateEligibilityResultRequest:
      type: object
      required: [result]
      properties:
        result:
          type: string
          enum: [ELIGIBLE, NOT_ELIGIBLE, REQUIRES_MORE_INFORMATION]

    Evidence:
      type: object
      required: [id, organization_id, service_request_id, type, description, uploaded_by, created_at]
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        organization_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        service_request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        type:
          type: string
          enum: [IDENTITY_DOCUMENT, PROOF_OF_RESIDENCE, REFERRAL, SUPPORTING_DOCUMENT, PHOTOGRAPH, STAFF_NOTE]
        description:
          type: string
        uploaded_by:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        created_at:
          type: string
          format: date-time

    CreateEvidenceRequest:
      type: object
      required: [service_request_id, type, description]
      properties:
        service_request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        type:
          type: string
          enum: [IDENTITY_DOCUMENT, PROOF_OF_RESIDENCE, REFERRAL, SUPPORTING_DOCUMENT, PHOTOGRAPH, STAFF_NOTE]
        description:
          type: string

    Assessment:
      type: object
      required: [id, organization_id, service_request_id, findings, recommendation, assessor, assessed_at, created_at]
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        organization_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        service_request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        findings:
          type: string
        needs_identified:
          type: string
          nullable: true
        recommendation:
          type: string
        assessor:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        assessed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    CreateAssessmentRequest:
      type: object
      required: [service_request_id, findings, recommendation]
      properties:
        service_request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        findings:
          type: string
        needs_identified:
          type: string
          nullable: true
        recommendation:
          type: string

    Decision:
      type: object
      required: [id, organization_id, service_request_id, decision, reason, decision_maker, decided_at, created_at]
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        organization_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        service_request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        decision:
          type: string
          enum: [APPROVED, REJECTED, NEEDS_MORE_INFORMATION]
        reason:
          type: string
        decision_maker:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        decided_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    CreateDecisionRequest:
      type: object
      required: [service_request_id, decision, reason]
      properties:
        service_request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        decision:
          type: string
          enum: [APPROVED, REJECTED, NEEDS_MORE_INFORMATION]
        reason:
          type: string

    Assistance:
      type: object
      required: [id, organization_id, service_request_id, type, description, status, responsible_staff, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        organization_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        service_request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        type:
          type: string
          enum: [FINANCIAL, FOOD, SHELTER, MEDICAL, EDUCATION, TRANSPORT, OTHER]
        description:
          type: string
        status:
          type: string
          enum: [PLANNED, IN_PROGRESS, COMPLETED, CANCELLED]
        responsible_staff:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateAssistanceRequest:
      type: object
      required: [service_request_id, type, description, responsible_staff]
      properties:
        service_request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        type:
          type: string
          enum: [FINANCIAL, FOOD, SHELTER, MEDICAL, EDUCATION, TRANSPORT, OTHER]
        description:
          type: string
        responsible_staff:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$

    UpdateAssistanceStatusRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [start, complete, cancel]

    FollowUp:
      type: object
      required: [id, organization_id, service_request_id, scheduled_date, outcome, notes, performed_by, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        organization_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        service_request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        scheduled_date:
          type: string
          format: date
        completed_date:
          type: string
          format: date
          nullable: true
        outcome:
          type: string
        notes:
          type: string
        performed_by:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateFollowUpRequest:
      type: object
      required: [service_request_id, scheduled_date, outcome, notes]
      properties:
        service_request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        scheduled_date:
          type: string
          format: date
          description: "ISO 8601 date (YYYY-MM-DD)"
        outcome:
          type: string
        notes:
          type: string

    CompleteFollowUpRequest:
      type: object
      required: [completed_date]
      properties:
        completed_date:
          type: string
          format: date
          description: "ISO 8601 date (YYYY-MM-DD)"

    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        organization_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        actor_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          nullable: true
        action:
          type: string
        resource:
          type: string
        resource_id:
          type: string
          nullable: true
        outcome:
          type: string
          enum: [success, failure]
        request_id:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
        hash:
          type: string
        previous_hash:
          type: string
          nullable: true

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok

    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
          example: ready

    WorkflowDefinition:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        version:
          type: integer
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
        initial_state:
          type: string
        states:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              key:
                type: string
              name:
                type: string
              description:
                type: string
                nullable: true
              category:
                type: string
                nullable: true
              terminal:
                type: boolean
              display_order:
                type: integer
              responsible_role:
                type: string
                nullable: true
        transitions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              key:
                type: string
              name:
                type: string
              description:
                type: string
                nullable: true
              from_state:
                type: string
              to_state:
                type: string
              conditions:
                type: array
                items:
                  type: object
                nullable: true
              allowed_roles:
                type: array
                items:
                  type: string
                nullable: true
              active:
                type: boolean
        metadata:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WorkflowInstance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        workflow_definition_id:
          type: string
          format: uuid
        workflow_definition_version:
          type: integer
        case_id:
          type: string
          format: uuid
        current_state:
          type: string
        version:
          type: integer
          description: Optimistic concurrency version; incremented on each transition
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        metadata:
          type: object
          nullable: true

    WorkflowTransition:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        from_state:
          type: string
        to_state:
          type: string
        conditions:
          type: array
          items:
            type: object
          nullable: true
        allowed_roles:
          type: array
          items:
            type: string
          nullable: true
        active:
          type: boolean
        created_at:
          type: string
          format: date-time

    WorkflowTransitionHistory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workflow_instance_id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        from_state:
          type: string
        to_state:
          type: string
        transition_key:
          type: string
        actor_id:
          type: string
          format: uuid
          nullable: true
        occurred_at:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true

    CreateWorkflowDefinitionRequest:
      type: object
      required: [key, name, version, initial_state, states, transitions]
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        version:
          type: integer
          minimum: 1
        initial_state:
          type: string
        states:
          type: array
          items:
            type: object
          minItems: 1
        transitions:
          type: array
          items:
            type: object
          minItems: 0
        metadata:
          type: object
          nullable: true

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Health check
      description: Returns OK if the server is running.
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          description: Server is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Server is starting up or shutting down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ready:
    get:
      operationId: listready
      tags: [System]
      summary: Readiness check
      description: Returns OK if the server is ready to serve requests (database connected, etc.).
      responses:
        '200':
          description: Server is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: Server is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /organizations:
    post:
      operationId: createOrganizations
      tags: [Organizations]
      summary: Create a new organization
      description: Creates a new organization (tenant). No authentication required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Organization slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /organizations/{orgId}:
    get:
      operationId: getOrg
      tags: [Organizations]
      summary: Get organization details
      description: Retrieves organization configuration. Requires authentication.
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{orgId}/auth/register:
    post:
      operationId: createOrgauthregister
      tags: [Authentication]
      summary: Register a new user
      description: Creates a new user within the specified organization. No prior authentication required.
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered (returns user data, not token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered in this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /organizations/{orgId}/auth/login:
    post:
      operationId: createOrgauthlogin
      tags: [Authentication]
      summary: Authenticate user and get token
      description: Authenticates a user and returns a JWT bearer token.
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /organizations/{orgId}/users:
    get:
      operationId: getOrgusers
      tags: [Users]
      summary: List users
      description: Lists all users in the organization. Requires authentication.
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /organizations/{orgId}/users/{userId}:
    get:
      operationId: getOrgusersUser
      tags: [Users]
      summary: Get user
      description: Retrieves a specific user. Requires authentication.
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{orgId}/cases:
    post:
      operationId: createOrgcases
      tags: [Cases]
      summary: Create a case
      description: Creates a new case (service request) within the organization. Requires authentication.
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: Idempotency-Key
          in: header
          description: |
            Idempotency key for safe retries. Guarantees at-most-once execution
            for the same key within the same organization.
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequest'
      responses:
        '201':
          description: "Case created (status: CREATED)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      operationId: getOrgcases
      tags: [Cases]
      summary: List cases
      description: Lists cases in the organization. Requires authentication.
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [NEW, OPEN, IN_REVIEW, ASSESSMENT, DECISION_PENDING, APPROVED, REJECTED, IN_PROGRESS, FOLLOW_UP, CLOSED]
          description: Filter cases by status
      responses:
        '200':
          description: List of cases with pagination
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Case'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /organizations/{orgId}/cases/{caseId}:
    get:
      operationId: getOrgcasesCase
      tags: [Cases]
      summary: Get a case
      description: Retrieves a specific case. Requires authentication.
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: caseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      responses:
        '200':
          description: Case details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{orgId}/cases/{caseId}/timeline:
    get:
      operationId: getOrgcasesCaseTimeline
      tags: [Cases]
      summary: Get case timeline
      description: Returns a chronological timeline of audit events for a case.
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: caseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      responses:
        '200':
          description: Chronological list of audit events for the case
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimelineEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{orgId}/cases/{caseId}/transitions:
    post:
      operationId: createOrgcasesCasetransitions
      tags: [Cases]
      summary: Change case status
      description: |
        Transitions a case to a new status. Invalid transitions are rejected.

        Valid transitions:
        - NEW → OPEN
        - NEW → IN_REVIEW
        - OPEN → IN_REVIEW
        - IN_REVIEW → ASSESSMENT
        - IN_REVIEW → OPEN (reopen)
        - ASSESSMENT → DECISION_PENDING
        - DECISION_PENDING → APPROVED
        - DECISION_PENDING → REJECTED
        - APPROVED → IN_PROGRESS
        - REJECTED → CLOSED
        - IN_PROGRESS → FOLLOW_UP
        - FOLLOW_UP → CLOSED
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: caseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeCaseStatusRequest'
      responses:
        '200':
          description: Case with updated status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /organizations/{orgId}/cases/{caseId}/assign:
    post:
      operationId: createOrgcasesCaseassign
      tags: [Cases]
      summary: Assign case to a user
      description: Assigns a case to a user. Requires authentication.
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: caseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignCaseRequest'
      responses:
        '200':
          description: Case with assignment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{orgId}/workflows:
    get:
      operationId: listOrgWorkflows
      tags: [Workflows]
      summary: List workflow definitions
      description: Lists workflow definitions for the organization. Requires authentication.
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
