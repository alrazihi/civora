openapi: 3.0.3
info:
  title: CIVORA API
  description: >-
    CIVORA API - open-source infrastructure for configurable, auditable public-service workflows, case management, forms, rules, and human decisions. Version 0.7.0. Configurable workflow-driven service delivery: create custom states and transitions, activate a definition, bind a case to it via workflow_id, and drive the case through the workflow lifecycle. Any state can be marked terminal; terminal states block further transitions and set the case closed_at timestamp. Full end-to-end workflow for public service delivery: Request, Person registered, Case created, Eligibility assessed, Evidence collected, Decision made, Assistance provided, Terminal state reached. State machine is defined by the workflow definition, not hardcoded. API-first: all functionality is exposed through versioned HTTP REST endpoints with JSON request/response bodies. Authentication uses bearer tokens. OpenAPI 3.0 specification. Multi-tenant: all data is scoped by organization; cross-tenant access is prevented at the data-access layer. Deterministic rules engine: rule sets are configured as JSON via the API, evaluated against case facts, and produce full trace trees with human-readable explanations. Human-in-the-loop: rules are advisory; final decisions are made by humans and recorded with rationale, actor, and timestamp. AI observation assistance is opt-in and human-reviewed. Audit trail: every state transition, form submission, rule evaluation, evidence addition, and human decision is recorded in a tamper-evident, hash-chained audit log isolated in a dedicated PostgreSQL schema.
  version: 0.8.0
  contact:
    name: CIVORA
    url: https://github.com/alrazihi/civora
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server.
security: []
tags:
  - name: Organizations
    description: Organization (tenant) management
  - name: Authentication
    description: User registration and authentication
  - name: Users
    description: User management within an organization
  - name: People
    description: Person (client/individual) records
  - name: Cases
    description: Case lifecycle management with state transitions
  - name: Eligibilities
    description: Eligibility assessment for service requests
  - name: Evidence
    description: Evidence items submitted for service requests
  - name: Assessments
    description: Needs assessment and recommendations
  - name: Decisions
    description: Human decisions on service requests
  - name: Assistance
    description: Assistance actions and services provided
  - name: FollowUps
    description: Follow-up scheduling and completion
  - name: Audit
    description: Immutable audit event log
  - name: Workflows
    description: Configurable workflow definitions, instances, and transitions
  - name: Forms
    description: Configurable forms for data collection
  - name: Rules
    description: Deterministic eligibility rules engine configuration and evaluation
  - name: ReviewQueue
    description: Human reviewer work queue and decision tracking
  - name: AI
    description: AI observation generation, review, and provenance
  - name: System
    description: Health and readiness checks

