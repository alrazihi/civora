openapi: 3.0.3
info:
  title: CIVORA API
  description: >-
      CIVORA API - open-source infrastructure for configurable, auditable
      public-service workflows, case management, forms, rules, and human
      decisions. Version 0.7.0.
      Configurable workflow-driven service delivery: create custom states and
      transitions, activate a definition, bind a case to it via workflow_id, and
      drive the case through the workflow lifecycle. Any state can be marked
      terminal; terminal states block further transitions and set the case
      closed_at timestamp. Full end-to-end workflow for public service delivery:
      Request, Person registered, Case created, Eligibility assessed, Evidence
      collected, Decision made, Assistance provided, Terminal state reached.
      State machine is defined by the workflow definition, not hardcoded.
      API-first: all functionality is exposed through versioned HTTP REST
      endpoints with JSON request/response bodies. Authentication uses bearer
      tokens. OpenAPI 3.0 specification. Multi-tenant: all data is scoped by
      organization; cross-tenant access is prevented at the data-access layer.
      Deterministic rules engine: rule sets are configured as JSON via the API,
      evaluated against case facts, and produce full trace trees with
      human-readable explanations. Human-in-the-loop: rules are advisory; final
      decisions are made by humans and recorded with rationale, actor, and
      timestamp. AI observation assistance is opt-in and human-reviewed. Audit trail:
       every state transition, form submission, rule evaluation, evidence
       addition, and human decision is recorded in a tamper-evident, hash-chained
       audit log isolated in a dedicated PostgreSQL schema.
  version: 0.8.0
  contact:
    name: CIVORA
    url: https://github.com/alrazihi/civora
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: http://localhost:8080
  description: Local development server. Override with CIVORA_API_URL in production.
security: []
tags:
- name: Organizations
  description: Organization (tenant) management
- name: Authentication
  description: User registration and authentication
- name: Users
  description: User management within an organization
- name: People
  description: Person (client/individual) records
- name: Cases
  description: Case lifecycle management with state transitions
- name: Eligibilities
  description: Eligibility assessment for service requests
- name: Evidence
  description: Evidence items submitted for service requests
- name: Assessments
  description: Needs assessment and recommendations
- name: Decisions
  description: Human decisions on service requests
- name: Assistance
  description: Assistance actions and services provided
- name: FollowUps
  description: Follow-up scheduling and completion
- name: Audit
  description: Immutable audit event log
- name: Workflows
  description: Configurable workflow definitions, instances, and transitions
- name: Forms
  description: Configurable forms for data collection
- name: Rules
  description: Deterministic eligibility rules engine configuration and evaluation
- name: ReviewQueue
  description: Human reviewer work queue and decision tracking
- name: AI
  description: AI observation generation, review, and provenance
- name: System
  description: Health and readiness checks
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT bearer token. The token must include `organization_id` claim.

        The API validates that the token''s organization matches the `{orgId}`

        path parameter on all tenant-scoped endpoints.

        '
  headers:
    X-Request-ID:
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      description: Correlation ID for the request. Generated if not provided by the
        client.
  schemas:
    AIObservation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
          nullable: true
        evidence_id:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          enum: [SUMMARY, ENTITY_EXTRACTION, CLASSIFICATION, INCONSISTENCY, MISSING_INFORMATION, RELEVANT_EVIDENCE, INCOMPLETE_DOCUMENTATION]
        source:
          type: string
          enum: [AI_MODEL, HUMAN]
        status:
          type: string
          enum: [OPEN, PENDING_REVIEW, ACCEPTED, REJECTED, CORRECTED, DISMISSED]
        model:
          $ref: '#/components/schemas/AIModelInfo'
        content:
          type: object
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
        statement:
          type: string
        source_references:
          type: array
          items:
            $ref: '#/components/schemas/SourceReference'
        input_hash:
          type: string
        output_hash:
          type: string
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        reviewed_by:
          type: string
          format: uuid
          nullable: true
        review_notes:
          type: string
          nullable: true
    AIModelInfo:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        provider:
          type: string
    GenerateObservationsRequest:
      type: object
      properties:
        types:
          type: array
          items:
            type: string
            enum: [SUMMARY, ENTITY_EXTRACTION, CLASSIFICATION, INCONSISTENCY]
        max_tokens:
          type: integer
          minimum: 1
          default: 4096
    ReviewObservationRequest:
      type: object
      properties:
        notes:
          type: string
          maxLength: 5000
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: INVALID_INPUT
            message:
              type: string
              example: title is required
    Organization:
      type: object
      required:
      - id
      - name
      - slug
      - created_at
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        name:
          type: string
        description:
          type: string
          nullable: true
        slug:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
    CreateOrganizationRequest:
      type: object
      required:
      - name
      - slug
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 64
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RegisterRequest:
      type: object
      required:
      - email
      - name
      - password
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          maxLength: 200
        password:
          type: string
          minLength: 12
          pattern: ^(?=.*[a-zA-Z])(?=.*[0-9]).+$
          description: At least 12 characters with at least one letter and one number
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT bearer token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
              pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            organization_id:
              type: string
              format: uuid
              pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            email:
              type: string
              format: email
            name:
              type: string
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        organization_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        email:
          type: string
          format: email
        name:
          type: string
        role_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          nullable: true
        created_at:
          type: string
          format: date-time
    Case:
      type: object
      required:
      - id
      - organization_id
      - case_number
      - title
      - status
      - service_type
      - priority
      - created_by
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        organization_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        case_number:
          type: string
          example: CAS-20260906-00001234
        person_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          description: Case status synchronized from the configured workflow
        service_type:
          type: string
          enum:
          - GENERAL
          - EMERGENCY
          - FINANCIAL
          - FOOD
          - SHELTER
          - MEDICAL
          - EDUCATION
          - TRANSPORT
        priority:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
        created_by:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        assigned_to:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
        workflow_instance_id:
          type: string
          format: uuid
          nullable: true
          description: Linked workflow instance ID for generic workflow-driven state
            transitions
        workflow_state:
          type: string
          nullable: true
          description: Authoritative lifecycle state from the linked workflow instance.
            Mirrors status but is the single source of truth for lifecycle transitions.
    CaseStatistics:
      type: object
      required:
      - total
      - open
      - closed
      - rejected
      - urgent
      - awaiting_review
      - awaiting_decision
      - in_progress
      - follow_up
      - by_status
      - by_service_type
      - by_priority
      - recent_cases
      properties:
        total:
          type: integer
          format: int32
          minimum: 0
        open:
          type: integer
          format: int32
          minimum: 0
        closed:
          type: integer
          format: int32
          minimum: 0
        rejected:
          type: integer
          format: int32
          minimum: 0
        urgent:
          type: integer
          format: int32
          minimum: 0
        awaiting_review:
          type: integer
          format: int32
          minimum: 0
        awaiting_decision:
          type: integer
          format: int32
          minimum: 0
        in_progress:
          type: integer
          format: int32
          minimum: 0
        follow_up:
          type: integer
          format: int32
          minimum: 0
        by_status:
          type: object
          additionalProperties:
            type: integer
            format: int32
            minimum: 0
        by_service_type:
          type: object
          additionalProperties:
            type: integer
            format: int32
            minimum: 0
        by_priority:
          type: object
          additionalProperties:
            type: integer
            format: int32
            minimum: 0
        recent_cases:
          type: array
          items:
            $ref: '#/components/schemas/Case'
    CreateCaseRequest:
      type: object
      required:
      - title
      - service_type
      - priority
      properties:
        title:
          type: string
          maxLength: 300
        description:
          type: string
          maxLength: 5000
        service_type:
          type: string
          enum:
          - GENERAL
          - EMERGENCY
          - FINANCIAL
          - FOOD
          - SHELTER
          - MEDICAL
          - EDUCATION
          - TRANSPORT
        priority:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
        person_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        workflow_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          nullable: true
          description: |-
            Optional workflow definition ID. Must be an ACTIVE workflow belonging
            to the organization. If omitted, the workflow is resolved from the
            service_type via a configurable, database-driven mapping
            (workflow_definitions.metadata.service_type). If none is found,
            workflow_id is required.
    ChangeCaseStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: Workflow state key to transition to
    AssignCaseRequest:
      type: object
      required:
      - user_id
      properties:
        user_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    TimelineEvent:
      type: object
      required:
      - id
      - action
      - resource
      - outcome
      - timestamp
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        action:
          type: string
        resource:
          type: string
        outcome:
          type: string
          enum:
          - success
          - failure
        timestamp:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
    Person:
      type: object
      required:
      - id
      - organization_id
      - first_name
      - last_name
      - preferred_language
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        organization_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        external_reference:
          type: string
          nullable: true
        first_name:
          type: string
        last_name:
          type: string
        date_of_birth:
          type: string
          format: date
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        preferred_language:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreatePersonRequest:
      type: object
      required:
      - first_name
      - last_name
      - preferred_language
      properties:
        external_reference:
          type: string
          nullable: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        date_of_birth:
          type: string
          format: date
          description: ISO 8601 date (YYYY-MM-DD), nullable
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          maxLength: 500
          nullable: true
        city:
          type: string
          maxLength: 100
          nullable: true
        preferred_language:
          type: string
          maxLength: 10
    UpdatePersonStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
    Eligibility:
      type: object
      required:
      - id
      - organization_id
      - service_request_id
      - criteria
      - result
      - explanation
      - assessed_by
      - assessed_at
      - created_at
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        organization_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        service_request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        criteria:
          type: object
          additionalProperties: true
          description: JSONB object containing eligibility criteria
        result:
          type: string
          enum:
          - ELIGIBLE
          - NOT_ELIGIBLE
          - REQUIRES_MORE_INFORMATION
        explanation:
          type: string
        assessed_by:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        assessed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    CreateEligibilityRequest:
      type: object
      required:
      - service_request_id
      - criteria
      - explanation
      properties:
        service_request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        criteria:
          type: object
          additionalProperties: true
        explanation:
          type: string
    UpdateEligibilityResultRequest:
      type: object
      required:
      - result
      properties:
        result:
          type: string
          enum:
          - ELIGIBLE
          - NOT_ELIGIBLE
          - REQUIRES_MORE_INFORMATION
    Evidence:
      type: object
      required:
      - id
      - organization_id
      - service_request_id
      - type
      - description
      - uploaded_by
      - created_at
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        organization_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        service_request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        type:
          type: string
          enum:
          - IDENTITY_DOCUMENT
          - PROOF_OF_RESIDENCE
          - REFERRAL
          - SUPPORTING_DOCUMENT
          - PHOTOGRAPH
          - STAFF_NOTE
          - OTHER
        custom_type:
          type: string
          description: Custom evidence type name, required when type is OTHER.
          nullable: true
        description:
          type: string
        uploaded_by:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        person_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          nullable: true
          description: Person associated with this evidence.
        source:
          type: string
          enum:
          - UPLOAD
          - EXTERNAL_REFERENCE
          - EXTERNAL_API
          - MANUAL
          description: How the evidence entered the system.
        metadata:
          type: object
          description: Arbitrary structured metadata (file size, content type, checksum, etc.).
          additionalProperties: true
        verification_status:
          type: string
          enum:
          - UNVERIFIED
          - NEEDS_REVIEW
          - VERIFIED
          - REJECTED
          description: Current verification status of the evidence.
        verified_by:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          nullable: true
          description: User who last changed the verification status.
        verified_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last verification state change.
        verification_reason:
          type: string
          nullable: true
          description: Reason for the current verification status.
        verification_method:
          type: string
          nullable: true
          description: Method used for verification (e.g. manual, automated).
        created_at:
          type: string
          format: date-time
    VerificationRecord:
      type: object
      required:
      - id
      - evidence_id
      - status
      - verified_at
      - created_at
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        evidence_id:
          type: string
