    RequestInformationRequest:
      type: object
      required:
        - missing_fields
        - reason
      properties:
        missing_fields:
          type: array
          items:
            type: string
        reason:
          type: string

    CaseSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [FULL_SUMMARY, SITUATION, RELEVANT_INFORMATION, IMPORTANT_EVIDENCE, MISSING_INFORMATION, POTENTIAL_INCONSISTENCIES, RULE_EVALUATION_RESULTS, WORKFLOW_HISTORY, PREVIOUS_ACTIONS, AI_OBSERVATIONS]
        source:
          type: string
          enum: [AI_MODEL, HUMAN]
        status:
          type: string
          enum: [PENDING_REVIEW, ACCEPTED, REJECTED]
        model:
          $ref: '#/components/schemas/AIModelInfo'
        content:
          $ref: '#/components/schemas/CaseSummaryContent'
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
        input_hash:
          type: string
        output_hash:
          type: string
        schema_version:
          type: string
        token_estimate:
          type: integer
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        reviewed_by:
          type: string
          format: uuid
          nullable: true
        review_notes:
          type: string
          nullable: true
    CaseSummaryContent:
      type: object
      properties:
        situation:
          type: array
          items:
            $ref: '#/components/schemas/CaseSummaryClaim'
        relevant_information:
          type: array
          items:
            $ref: '#/components/schemas/CaseSummaryClaim'
        important_evidence:
          type: array
          items:
            $ref: '#/components/schemas/CaseSummaryClaim'
        missing_information:
          type: array
          items:
            $ref: '#/components/schemas/CaseSummaryClaim'
        potential_inconsistencies:
          type: array
          items:
            $ref: '#/components/schemas/CaseSummaryClaim'
        rule_evaluation_results:
          type: array
          items:
            $ref: '#/components/schemas/CaseSummaryClaim'
        workflow_history:
          type: array
          items:
            $ref: '#/components/schemas/CaseSummaryClaim'
        previous_actions:
          type: array
          items:
            $ref: '#/components/schemas/CaseSummaryClaim'
        ai_observations:
          type: array
          items:
            $ref: '#/components/schemas/CaseSummaryClaim'
    CaseSummaryClaim:
      type: object
      required:
        - text
        - provenance
      properties:
        text:
          type: string
        provenance:
          type: string
          enum: [FACT, SOURCE, AI_OBSERVATION, RULE_RESULT, HUMAN_DECISION, WORKFLOW_HISTORY]
        references:
          type: array
          items:
            $ref: '#/components/schemas/SourceReference'
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
    SourceReference:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
          enum: [evidence, document, form_submission, rule_evaluation, decision, workflow_transition, ai_observation, case_metadata, person]
        id:
          type: string
          format: uuid
        label:
          type: string
    GenerateCaseSummaryRequest:
      type: object
      properties:
        types:
          type: array
          items:
            type: string
            enum: [FULL_SUMMARY, SITUATION, RELEVANT_INFORMATION, IMPORTANT_EVIDENCE, MISSING_INFORMATION, POTENTIAL_INCONSISTENCIES, RULE_EVALUATION_RESULTS, WORKFLOW_HISTORY, PREVIOUS_ACTIONS, AI_OBSERVATIONS]
        max_tokens:
          type: integer
          minimum: 1
          default: 4096
        include_sections:
          type: array
          items:
            type: string
    ReviewSummaryRequest:
      type: object
      properties:
        notes:
          type: string
          maxLength: 5000
    VerifiedFact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
          nullable: true
        observation_id:
          type: string
          format: uuid
        observation_type:
          type: string
        value:
          type: object
        original_value:
          type: object
        corrected_value:
          type: object
          nullable: true
        provenance:
          type: object
        review_action:
          type: string
          enum: [ACCEPTED, REJECTED, CORRECTED, DISMISSED]
        reviewer_id:
          type: string
          format: uuid
        review_notes:
          type: string
        created_at:
          type: string
          format: date-time
        verified_at:
          type: string
          format: date-time
        source:
          type: string
          enum: [AI_OBSERVATION, HUMAN_CORRECTION, HUMAN_ACCEPTED]
        model:
          $ref: '#/components/schemas/AIModelInfo'
        input_hash:
          type: string
        output_hash:
          type: string
    DocumentAnalysis:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        evidence_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [CLASSIFICATION, TEXT_EXTRACTION, STRUCTURED_EXTRACTION, SUMMARIZATION, RELEVANCE_DETECTION]
        source:
          type: string
          enum: [AI_MODEL, HUMAN]
        status:
          type: string
          enum: [PENDING_REVIEW, ACCEPTED, REJECTED]
        model:
          $ref: '#/components/schemas/AIModelInfo'
        content:
          type: object
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
        input_hash:
          type: string
        output_hash:
          type: string
        schema_version:
          type: string
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        reviewed_by:
          type: string
          format: uuid
          nullable: true
        review_notes:
          type: string
          nullable: true
    DocumentAnalysisRequest:
      type: object
      properties:
        types:
          type: array
          items:
            type: string
            enum: [CLASSIFICATION, TEXT_EXTRACTION, STRUCTURED_EXTRACTION, SUMMARIZATION, RELEVANCE_DETECTION]
        max_tokens:
          type: integer
          minimum: 1
          default: 4096
    CaseContext:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        facts:
          type: array
          items:
            $ref: '#/components/schemas/Fact'
        token_estimate:
          type: integer
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        authorization:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AuthorizationEntry'
    Fact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        source_type:
          type: string
        source_id:
          type: string
          format: uuid
        provenance:
          type: string
          enum: [SOURCE_FACT, AI_OBSERVATION, HUMAN_VERIFIED_FACT, RULE_RESULT, HUMAN_DECISION, FORM_SUBMISSION, WORKFLOW_HISTORY]
        key:
          type: string
        value:
          type: object
        value_type:
          type: string
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
        retrieved_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        metadata:
          type: object
          nullable: true
        references:
          type: array
          items:
            type: string
            format: uuid
    AuthorizationEntry:
      type: object
      properties:
        resource_type:
          type: string
        resource_ids:
          type: array
          items:
            type: string
            format: uuid
        granted:
          type: boolean
        reason:
          type: string
    ContextBuildRequest:
      type: object
      properties:
        include_case_metadata:
          type: boolean
          default: true
        include_person:
          type: boolean
          default: true
        include_evidence:
          type: boolean
          default: true
        include_verified_evidence:
          type: boolean
          default: true
        include_documents:
          type: boolean
          default: true
        include_form_submissions:
          type: boolean
          default: true
        include_rule_evaluations:
          type: boolean
          default: true
        include_workflow_history:
          type: boolean
          default: true
        include_decisions:
          type: boolean
          default: true
        include_ai_observations:
          type: boolean
          default: true
        max_tokens:
          type: integer
          minimum: 1
          default: 8000
        max_facts:
          type: integer
          minimum: 1
          default: 200
        only_verified:
          type: boolean
          default: false
        only_human_verified:
          type: boolean
          default: false

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Access forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RequestTooLarge:
      description: Request body too large (exceeds 1MB limit)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource conflict (e.g., duplicate key)
      content:
        application/json:
          schema:
             $ref: '#/components/schemas/Error'
paths:
  /organizations/{orgId}/review-queue:
    get:
      operationId: listReviewQueue
      tags:
        - ReviewQueue
      summary: List review queue entries
      description: Returns paginated review queue entries for the organization.
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, ASSIGNED, IN_REVIEW, COMPLETED, ESCALATED, WAITING_INFORMATION]
        - name: assigned_to_me
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Paginated review queue entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReviewQueueEntry'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createReviewQueueEntry
      tags:
        - ReviewQueue
      summary: Create a review queue entry
      description: Creates a new review queue entry for manual human review.
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewQueueEntryRequest'
      responses:
        '201':
          description: Review queue entry created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ReviewQueueEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /organizations/{orgId}/review-queue/{reviewId}:
    get:
      operationId: getReviewQueueEntry
      tags:
        - ReviewQueue
      summary: Get review queue entry
      description: Returns a single review queue entry by ID.
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Review queue entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ReviewQueueEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{orgId}/review-queue/{reviewId}/claim:
    post:
      operationId: claimReview
      tags:
        - ReviewQueue
      summary: Claim a review queue entry
      description: Assigns the review queue entry to the authenticated user.
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Review queue entry claimed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ReviewQueueEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Review is not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /organizations/{orgId}/review-queue/{reviewId}/start:
    post:
      operationId: startReview
      tags:
        - ReviewQueue
      summary: Start reviewing
      description: Marks the review queue entry as in review for the assigned user.
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Review started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ReviewQueueEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{orgId}/review-queue/{reviewId}/complete:
    post:
      operationId: completeReview
      tags:
        - ReviewQueue
      summary: Complete a review
      description: Marks the review as completed with a human decision.
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteReviewRequest'
      responses:
        '200':
          description: Review completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ReviewQueueEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Review is not in review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /organizations/{orgId}/review-queue/{reviewId}/escalate:
    post:
      operationId: escalateReview
      tags:
        - ReviewQueue
      summary: Escalate a review
      description: Marks the review as escalated for senior review.
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalateReviewRequest'
      responses:
        '200':
          description: Review escalated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ReviewQueueEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{orgId}/review-queue/{reviewId}/request-information:
    post:
      operationId: requestInformation
      tags:
        - ReviewQueue
      summary: Request more information
      description: Marks the review as waiting for additional information.
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestInformationRequest'
      responses:
        '200':
          description: Information requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ReviewQueueEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /health:
    get:
      operationId: getHealth
      tags:
      - System
      summary: Health check
      description: Returns OK if the server is running.
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          description: Server is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Server is starting up or shutting down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ready:
    get:
      operationId: listready
      tags:
      - System
      summary: Readiness check
      description: Returns OK if the server is ready to serve requests (database connected,
        etc.).
      responses:
        '200':
          description: Server is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: Server is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /organizations:
    post:
      operationId: createOrganizations
      tags:
      - Organizations
      summary: Create a new organization
      description: Creates a new organization (tenant). No authentication required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Organization slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /organizations/{orgId}:
    get:
      operationId: getOrg
      tags:
      - Organizations
      summary: Get organization details
      description: Retrieves organization configuration. Requires authentication.
      security:
      - BearerAuth: []
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{orgId}/auth/register:
    post:
      operationId: createOrgauthregister
      tags:
      - Authentication
      summary: Register a new user
      description: Creates a new user within the specified organization. No prior
        authentication required.
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered (returns user data, not token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered in this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /organizations/{orgId}/auth/login:
    post:
      operationId: createOrgauthlogin
      tags:
      - Authentication
      summary: Authenticate user and get token
      description: Authenticates a user and returns a JWT bearer token.
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /organizations/{orgId}/users:
    get:
      operationId: getOrgusers
      tags:
      - Users
      summary: List users
      description: Lists all users in the organization. Requires authentication.
      security:
      - BearerAuth: []
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
