    Condition:
      type: object
      description: A condition node. Either a leaf comparison (field/operator/value) or a group (all/any/not).
      properties:
        field:
          type: string
          description: The fact path being compared (e.g. "form.income_verification.amount").
        operator:
          type: string
          enum: [eq, neq, gt, gte, lt, lte, in, not_in, is, is_not, exists, not_exists, contains, matches, before, after, on_or_before, on_or_after]
          description: The comparison operator. Temporal operators compare RFC3339 date or date-time values in UTC.
        value:
          description: The expected value. Type depends on operator.
        all:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
          description: Group where ALL child conditions must be true.
        any:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
          description: Group where ANY child condition must be true.
        not:
          $ref: '#/components/schemas/Condition'
      additionalProperties: false

    Rule:
      type: object
      description: A single conditional rule with an outcome and priority.
      required:
        - outcome
        - conditions
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        priority:
          type: integer
          minimum: 0
        outcome:
          type: string
          enum: [ELIGIBLE, INELIGIBLE, REQUIRES_REVIEW, INFORMATION_REQUIRED, FLAG, SCORE, ERROR]
        conditions:
          $ref: '#/components/schemas/Condition'
        active:
          type: boolean
          description: Whether this rule is enabled.
        created_at:
          type: string
          format: date-time

    RuleTemplateScope:
      type: string
      enum: [ORG, GLOBAL]
      description: Scope of the rule template (ORG = tenant-scoped, GLOBAL = platform-wide).

    RuleTemplate:
      type: object
      description: A reusable rule template that can be instantiated into rule sets.
      required:
        - id
        - scope
        - key
        - name
        - rule
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        scope:
          $ref: '#/components/schemas/RuleTemplateScope'
        organization_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          nullable: true
          description: Organization ID (null for GLOBAL scope).
        key:
          type: string
          pattern: ^[a-z][a-z0-9_-]*$
          maxLength: 100
          description: Unique machine-readable identifier within the scope.
        name:
          type: string
          maxLength: 200
          description: Human-readable name.
        description:
          type: string
          maxLength: 2000
          nullable: true
          description: Human-readable description.
        category:
          type: string
          maxLength: 100
          nullable: true
          description: Category for grouping templates (e.g., 'eligibility', 'age', 'income').
        rule:
          $ref: '#/components/schemas/Rule'
        created_by:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRuleTemplateRequest:
