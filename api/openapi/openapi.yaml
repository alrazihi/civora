openapi: 3.0.3
info:
  title: CIVORA API
  description: "CIVORA API - open digital infrastructure for public-interest service\
    \ delivery.\n\nVersion: 0.3.0-workflow-engine\n\n## Configurable Workflow-Driven\
    \ Service Delivery\n\nCIVORA now supports fully configurable workflow definitions:\
    \ create\ncustom states and transitions, activate a definition, bind a case to\
    \ it\nvia `workflow_id`, and drive the case through the workflow lifecycle.\n\
    Any state can be marked terminal; terminal states block further\ntransitions and\
    \ set the case `closed_at` timestamp.\n\nFull end-to-end workflow for public service\
    \ delivery:\nRequest \xE2\u2020\u2019 Person registered \xE2\u2020\u2019 Case\
    \ created (initial state) \xE2\u2020\u2019\nEligibility assessed \xE2\u2020\u2019\
    \ Evidence collected \xE2\u2020\u2019 Decision made \xE2\u2020\u2019\nAssistance\
    \ provided \xE2\u2020\u2019 Terminal state reached\n\nState machine is defined\
    \ by the workflow definition, not hardcoded.\n"
  version: 0.3.0
  contact:
    name: CIVORA
    url: https://github.com/alrazihi/civora
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: http://localhost:8080
  description: Local development server. Override with CIVORA_API_URL in production.
security: []
tags:
- name: Organizations
  description: Organization (tenant) management
- name: Authentication
  description: User registration and authentication
- name: Users
  description: User management within an organization
- name: People
  description: Person (client/individual) records
- name: Cases
  description: Case lifecycle management with state transitions
- name: Eligibilities
  description: Eligibility assessment for service requests
- name: Evidence
  description: Evidence items submitted for service requests
- name: Assessments
  description: Needs assessment and recommendations
- name: Decisions
  description: Human decisions on service requests
- name: Assistance
  description: Assistance actions and services provided
- name: FollowUps
  description: Follow-up scheduling and completion
- name: Audit
  description: Immutable audit event log
- name: Workflows
  description: Configurable workflow definitions, instances, and transitions
- name: Forms
  description: Configurable forms for data collection
- name: System
  description: Health and readiness checks
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT bearer token. The token must include `organization_id` claim.

        The API validates that the token''s organization matches the `{orgId}`

        path parameter on all tenant-scoped endpoints.

        '
  headers:
    X-Request-ID:
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      description: Correlation ID for the request. Generated if not provided by the
        client.
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: INVALID_INPUT
            message:
              type: string
              example: title is required
    Organization:
      type: object
      required:
      - id
      - name
      - slug
      - created_at
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        name:
          type: string
        description:
          type: string
          nullable: true
        slug:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
    CreateOrganizationRequest:
      type: object
      required:
      - name
      - slug
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 64
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RegisterRequest:
      type: object
      required:
      - email
      - name
      - password
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          maxLength: 200
        password:
          type: string
          minLength: 12
          pattern: ^(?=.*[a-zA-Z])(?=.*[0-9]).+$
          description: At least 12 characters with at least one letter and one number
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT bearer token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
              pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            organization_id:
              type: string
              format: uuid
              pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            email:
              type: string
              format: email
            name:
              type: string
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        organization_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        email:
          type: string
          format: email
        name:
          type: string
        role_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          nullable: true
        created_at:
          type: string
          format: date-time
    Case:
      type: object
      required:
      - id
      - organization_id
      - case_number
      - title
      - status
      - service_type
      - priority
      - created_by
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        organization_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        case_number:
          type: string
          example: CAS-20260906-00001234
        person_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          description: Case status synchronized from the configured workflow
        service_type:
          type: string
          enum:
          - GENERAL
          - EMERGENCY
          - FINANCIAL
          - FOOD
          - SHELTER
          - MEDICAL
          - EDUCATION
          - TRANSPORT
        priority:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
        created_by:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        assigned_to:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
        workflow_instance_id:
          type: string
          format: uuid
          nullable: true
          description: Linked workflow instance ID for generic workflow-driven state
            transitions
        workflow_state:
          type: string
          nullable: true
          description: Authoritative lifecycle state from the linked workflow instance.
            Mirrors status but is the single source of truth for lifecycle transitions.
    CaseStatistics:
      type: object
      required:
      - total
      - open
      - closed
      - rejected
      - urgent
      - awaiting_review
      - awaiting_decision
      - in_progress
      - follow_up
      - by_status
      - by_service_type
      - by_priority
      - recent_cases
      properties:
        total:
          type: integer
          format: int32
          minimum: 0
        open:
          type: integer
          format: int32
          minimum: 0
        closed:
          type: integer
          format: int32
          minimum: 0
        rejected:
          type: integer
          format: int32
          minimum: 0
        urgent:
          type: integer
          format: int32
          minimum: 0
        awaiting_review:
          type: integer
          format: int32
          minimum: 0
        awaiting_decision:
          type: integer
          format: int32
          minimum: 0
        in_progress:
          type: integer
          format: int32
          minimum: 0
        follow_up:
          type: integer
          format: int32
          minimum: 0
        by_status:
          type: object
          additionalProperties:
            type: integer
            format: int32
            minimum: 0
        by_service_type:
          type: object
          additionalProperties:
            type: integer
            format: int32
            minimum: 0
        by_priority:
          type: object
          additionalProperties:
            type: integer
            format: int32
            minimum: 0
        recent_cases:
          type: array
          items:
            $ref: '#/components/schemas/Case'
    CreateCaseRequest:
      type: object
      required:
      - title
      - service_type
      - priority
      properties:
        title:
          type: string
          maxLength: 300
        description:
          type: string
          maxLength: 5000
        service_type:
          type: string
          enum:
          - GENERAL
          - EMERGENCY
          - FINANCIAL
          - FOOD
          - SHELTER
          - MEDICAL
          - EDUCATION
          - TRANSPORT
        priority:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
        person_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        workflow_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          nullable: true
          description: Optional workflow definition ID to use instead of the default
            service-type mapping. Must be an ACTIVE workflow belonging to the organization.
            If omitted, the workflow is determined by the service_type via WorkflowKeyForServiceType.
    ChangeCaseStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: Workflow state key to transition to
    AssignCaseRequest:
      type: object
      required:
      - user_id
      properties:
        user_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    TimelineEvent:
      type: object
      required:
      - id
      - action
      - resource
      - outcome
      - timestamp
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        action:
          type: string
        resource:
          type: string
        outcome:
          type: string
          enum:
          - success
          - failure
        timestamp:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
    Person:
      type: object
      required:
      - id
      - organization_id
      - first_name
      - last_name
      - preferred_language
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        organization_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        external_reference:
          type: string
          nullable: true
        first_name:
          type: string
        last_name:
          type: string
        date_of_birth:
          type: string
          format: date
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        preferred_language:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreatePersonRequest:
      type: object
      required:
      - first_name
      - last_name
      - preferred_language
      properties:
        external_reference:
          type: string
          nullable: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        date_of_birth:
          type: string
          format: date
          description: ISO 8601 date (YYYY-MM-DD), nullable
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          maxLength: 500
          nullable: true
        city:
          type: string
          maxLength: 100
          nullable: true
        preferred_language:
          type: string
          maxLength: 10
    UpdatePersonStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
    Eligibility:
      type: object
      required:
      - id
      - organization_id
      - service_request_id
      - criteria
      - result
      - explanation
      - assessed_by
      - assessed_at
      - created_at
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        organization_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        service_request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        criteria:
          type: object
          additionalProperties: true
          description: JSONB object containing eligibility criteria
        result:
          type: string
          enum:
          - ELIGIBLE
          - NOT_ELIGIBLE
          - REQUIRES_MORE_INFORMATION
        explanation:
          type: string
        assessed_by:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        assessed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    CreateEligibilityRequest:
      type: object
      required:
      - service_request_id
      - criteria
      - explanation
      properties:
        service_request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        criteria:
          type: object
          additionalProperties: true
        explanation:
          type: string
    UpdateEligibilityResultRequest:
      type: object
      required:
      - result
      properties:
        result:
          type: string
          enum:
          - ELIGIBLE
          - NOT_ELIGIBLE
          - REQUIRES_MORE_INFORMATION
    Evidence:
      type: object
      required:
      - id
      - organization_id
      - service_request_id
      - type
      - description
      - uploaded_by
      - created_at
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        organization_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        service_request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        type:
          type: string
          enum:
          - IDENTITY_DOCUMENT
          - PROOF_OF_RESIDENCE
          - REFERRAL
          - SUPPORTING_DOCUMENT
          - PHOTOGRAPH
          - STAFF_NOTE
        description:
          type: string
        uploaded_by:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        created_at:
          type: string
          format: date-time
    CreateEvidenceRequest:
      type: object
      required:
      - service_request_id
      - type
      - description
      - storage_reference
      properties:
        service_request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        type:
          type: string
          enum:
          - IDENTITY_DOCUMENT
          - PROOF_OF_RESIDENCE
          - REFERRAL
          - SUPPORTING_DOCUMENT
          - PHOTOGRAPH
          - STAFF_NOTE
        description:
          type: string
        storage_reference:
          type: string
          description: Validated object storage URI; accepted schemes are s3, gs,
            azureblob, and civora.
    Assessment:
      type: object
      required:
      - id
      - organization_id
      - service_request_id
      - findings
      - recommendation
      - assessor
      - assessed_at
      - created_at
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        organization_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        service_request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        findings:
          type: string
        needs_identified:
          type: string
          nullable: true
        recommendation:
          type: string
        assessor:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        assessed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    CreateAssessmentRequest:
      type: object
      required:
      - service_request_id
      - findings
      - recommendation
      properties:
        service_request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        findings:
          type: string
        needs_identified:
          type: string
          nullable: true
        recommendation:
          type: string
    Decision:
      type: object
      required:
      - id
      - organization_id
      - service_request_id
      - decision
      - reason
      - decision_maker
      - decided_at
      - created_at
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        organization_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        service_request_id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
          - NEEDS_MORE_INFORMATION
        reason:
          type: string
        decision_maker:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        decided_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    CreateDecisionRequest:
      type: object
      required:
      - service_request_id
      - decision
      - reason
      properties:
        service_request_id:
          type: string
          format: uuid
