    post:
      operationId: generateCaseSummary
      tags:
        - Cases
      summary: Generate AI case summary
      description: >-
        Generates an AI-assisted case summary with provenance-tagged claims.
        AI is opt-in (enabled via `CIVORA_AI_ENABLED`) and off by default; when
        no provider is configured a Noop provider rejects the call. Summaries
        are created in PENDING_REVIEW and require explicit human accept/reject.
        All writes (audit events + summaries) are atomic. Requires authentication.
      security:
      - BearerAuth: []
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      - name: caseId
        in: path
        required: true
