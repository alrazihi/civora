          pattern: ^[a-z][a-z0-9_-]*$
          maxLength: 100
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
          nullable: true
        category:
          type: string
          maxLength: 100
          nullable: true
        rule:
          $ref: '#/components/schemas/Rule'

    RuleSet:
      type: object
      description: A versioned, tenant-scoped collection of rules.
      required:
        - id
